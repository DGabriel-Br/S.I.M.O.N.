[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simon-local"
version = "0.2.0.dev0"
description = "S.I.M.O.N. - Simples Inteligência, Mais Ou Menos Normal"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[project.scripts]
simon = "simon.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/simon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
